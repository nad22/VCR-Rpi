[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Build options
build_flags = 
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO

; Standard ESP32 Arduino libraries (built-in)
lib_deps =
    BluetoothSerial

; Optimization and debugging
upload_protocol = esptool

; Custom serial monitor
monitor_rts = 0
monitor_dtr = 0
